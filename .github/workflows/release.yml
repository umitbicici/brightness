# Builds the app for a version tag (vX.Y.Z), signs and notarizes it when a
# Developer ID certificate is configured, and publishes it as a draft GitHub
# release together with the Sparkle appcast. Publish the draft to roll the
# update out to users.
#
# Required secret:  SPARKLE_PRIVATE_KEY   (see RELEASING.md)
# Optional secrets: DEVELOPER_ID_CERTIFICATE, DEVELOPER_ID_CERTIFICATE_PASSWORD,
#                   APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.ref_name }}
      SIGNED: ${{ secrets.DEVELOPER_ID_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            SIGNING=(CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$TEAM_ID" OTHER_CODE_SIGN_FLAGS=--timestamp)
          else
            SIGNING=(CODE_SIGN_IDENTITY="-")
          fi
          xcodebuild -project Brightness.xcodeproj -scheme Brightness -configuration Release \
            -derivedDataPath build/DerivedData -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO "${SIGNING[@]}" build
          mkdir -p dist
          ditto build/DerivedData/Build/Products/Release/Brightness.app dist/Brightness.app

      - name: Notarize
        if: env.SIGNED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent dist/Brightness.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple dist/Brightness.app

      - name: Package
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist/updates
          ditto -c -k --sequesterRsrc --keepParent dist/Brightness.app "dist/updates/Brightness-$VERSION.zip"
          hdiutil create -volname Brightness -srcfolder dist/Brightness.app -ov -format UDZO "dist/Brightness-$VERSION.dmg"

      - name: Generate the Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_BIN=$(dirname "$(find build/DerivedData/SourcePackages/artifacts -name generate_appcast -type f | head -1)")
          echo "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$TAG/" \
            dist/updates

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          NOTE=""
          if [ "$SIGNED" != "true" ]; then
            NOTE=$'\n\n> This build is not notarized: on first launch, right-click the app in Finder and choose Open.'
          fi
          gh release create "$TAG" --draft --title "Brightness $VERSION" \
            --notes "See the commit history for changes.$NOTE" \
            "dist/Brightness-$VERSION.dmg" "dist/updates/Brightness-$VERSION.zip" dist/updates/appcast.xml
