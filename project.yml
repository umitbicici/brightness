# Xcode project definition. Generate the .xcodeproj with:  xcodegen generate
name: Brightness
options:
  bundleIdPrefix: com.umitbicici
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0

settings:
  base:
    MARKETING_VERSION: 0.1.0
    # Sparkle EdDSA public key (the private key lives in the login Keychain and in CI secrets).
    SPARKLE_PUBLIC_KEY: R5FF7B+nhBF88bh7Y+OgyqMmDjoQeJkyjdy162pXcag=
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # Required for notarization only; the release workflow turns it on for
    # Developer ID builds. With ad-hoc signing it would block loading the
    # embedded Sparkle framework (library validation needs a Team ID).
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Brightness:
    type: application
    platform: macOS
    sources:
      - path: Brightness
    dependencies:
      - package: Sparkle
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_NAME: Brightness
        PRODUCT_BUNDLE_IDENTIFIER: com.umitbicici.brightness
        INFOPLIST_FILE: Brightness/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Brightness/Support/PrivateAPIs.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: [-framework, CoreDisplay]
        # Ad-hoc signing for local builds; CI signs with a Developer ID.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        COMBINE_HIDPI_IMAGES: YES

  BrightnessTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BrightnessTests
    dependencies:
      - target: Brightness
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Brightness.app/Contents/MacOS/Brightness
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  Brightness:
    build:
      targets:
        Brightness: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BrightnessTests
    archive:
      config: Release
